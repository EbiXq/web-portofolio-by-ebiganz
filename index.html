<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Login - Ganz Website</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- BACKGROUND -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <!-- LOGIN -->
    <main class="login-container">
      <div class="login-box">
        <div class="logo">G</div>

        <h1>Selamat Datang</h1>

        <p class="subtitle">Login untuk melanjutkan ke website</p>

        <!-- FORM -->

        <form id="loginForm">
          <div class="input-group">
            <label for="username"> Username </label>

            <div class="input-wrapper">
              <span class="icon">👤</span>

              <input
                type="text"
                id="username"
                placeholder="Masukkan username"
                required
              />
            </div>
          </div>

          <div class="input-group">
            <label for="password"> Password </label>

            <div class="input-wrapper">
              <span class="icon">🔒</span>

              <input
                type="password"
                id="password"
                placeholder="Masukkan password"
                required
              />
            </div>
          </div>

          <div class="forgot">
            <a href="forgot-password.html"> Lupa Password? </a>
          </div>

          <button type="submit" class="main-button">Login</button>
        </form>

        <!-- REGISTER -->

        <p class="switch-text">
          Belum punya akun?

          <a href="register.html"> Buat Akun </a>
        </p>

        <!-- DIVIDER -->

        <div class="divider">
          <span></span>

          <p>atau</p>

          <span></span>
        </div>

        <!-- GOOGLE -->

        <button type="button" class="google-button">
          <span class="google-icon"> G </span>

          Lanjutkan dengan Google
        </button>
      </div>

      <p class="copyright">© 2026 Ebi Website</p>
    </main>
  </body>
</html>
