<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lupa Password - Ganz Website</title>

    <link rel="stylesheet" href="forgot-password.css">
</head>

<body>

    <!-- BACKGROUND -->

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>


    <main class="forgot-container">

        <div class="forgot-box">

            <!-- LOGO -->

            <div class="logo">
                G
            </div>


            <!-- TITLE -->

            <h1 id="title">
                Lupa Password?
            </h1>

            <p class="subtitle" id="subtitle">
                Masukkan email untuk mereset password
            </p>


            <!-- =====================
                 STEP 1
                 EMAIL
                 ===================== -->

            <div id="step1">

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <div class="input-wrapper">

                        <span class="icon">
                            ✉
                        </span>

                        <input
                            type="email"
                            id="email"
                            placeholder="Masukkan email kamu"
                        >

                    </div>

                </div>


                <button
                    type="button"
                    class="main-button"
                    id="sendCode"
                >
                    Kirim Kode Reset
                </button>

            </div>


            <!-- =====================
                 STEP 2
                 KODE
                 ===================== -->

            <div
                id="step2"
                class="hidden"
            >

                <div class="input-group">

                    <label for="code">
                        Kode Reset
                    </label>

                    <div class="input-wrapper">

                        <span class="icon">
                            🔐
                        </span>

                        <input
                            type="text"
                            id="code"
                            placeholder="Masukkan kode 6 digit"
                            maxlength="6"
                        >

                    </div>

                </div>


                <button
                    type="button"
                    class="main-button"
                    id="verifyCode"
                >
                    Verifikasi Kode
                </button>

            </div>


            <!-- =====================
                 STEP 3
                 PASSWORD BARU
                 ===================== -->

            <div
                id="step3"
                class="hidden"
            >

                <div class="input-group">

                    <label for="newPassword">
                        Password Baru
                    </label>

                    <div class="input-wrapper">

                        <span class="icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Masukkan password baru"
                        >

                    </div>

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Konfirmasi Password
                    </label>

                    <div class="input-wrapper">

                        <span class="icon">
                            🔒
                        </span>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Ulangi password baru"
                        >

                    </div>

                </div>


                <button
                    type="button"
                    class="main-button"
                    id="resetPassword"
                >
                    Ubah Password
                </button>

            </div>


            <!-- KEMBALI KE LOGIN -->

            <p class="switch-text">

                Ingat password?

                <a href="index.html">
                    Kembali ke Login
                </a>

            </p>

        </div>


        <p class="copyright">
            © 2026 Ganz Website
        </p>

    </main>


    <script src="forgot-password.js"></script>

</body>
</html>
